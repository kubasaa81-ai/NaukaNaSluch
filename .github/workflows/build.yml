name: Buduj APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Budowanie
        run: gradle assembleRelease --no-daemon
      - name: Nazwa pliku
        run: cp app/build/outputs/apk/release/app-release.apk NaukaNaSluch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NaukaNaSluch
          path: NaukaNaSluch.apk
      - name: Wydanie (link do pobrania na telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: Nauka na słuch – najnowsza wersja
          body: Pobierz NaukaNaSluch.apk i zainstaluj na telefonie.
          files: NaukaNaSluch.apk
          make_latest: true
